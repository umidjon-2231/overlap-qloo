# Production stack: web (Next.js) + api (Hono) → Postgres.
# The host's Apache terminates TLS (certbot) and proxies to the loopback ports below:
#   /api/* → 127.0.0.1:3071 (prefix stripped), everything else → 127.0.0.1:3070.
# See deploy/apache/overlap.u.co.uz.conf. Usage on the server:
#   cp .env.example .env   # fill QLOO_API_KEY, CLAUDE_API_KEY, DOMAIN, POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: overlap
      POSTGRES_USER: overlap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overlap -d overlap"]
      interval: 5s
      retries: 10
    # No ports: reachable only on the compose network.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://overlap:${POSTGRES_PASSWORD}@postgres:5432/overlap
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      API_PORT: 8787
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "127.0.0.1:3071:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3070:3000"

volumes:
  pgdata:
